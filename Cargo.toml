[package]
name = "winwam"
version = "0.1.0"
edition = "2024"
description = "Windows WoW Addon Manager"

[dependencies]
hex = "0.4"
open = "5"
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
ureq = { version = "3", default-features = false, features = ["rustls"] }
windows-reactor = "0.100"
zip = { version = "2", default-features = false, features = ["deflate"] }

[build-dependencies]
windows-reactor-setup = "0.100"
winresource = "0.1"

[profile.release]
panic = "abort"
strip = true
lto = "thin"
